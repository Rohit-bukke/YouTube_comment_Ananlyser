version: "3.8"

services:
  api:
    build: .
    container_name: sentiment-api
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped

  dashboard:
    build: .
    container_name: sentiment-dashboard
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - LOG_LEVEL=INFO
    depends_on:
      - api
    restart: unless-stopped
